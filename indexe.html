<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente Paracetaloka</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eaf7ef, #ffffff);
            color: #24352b;
        }

        .container {
            width: min(460px, 100%);
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(25, 90, 55, 0.15);
            overflow: hidden;
            border: 1px solid #dceee2;
        }

        .cabecalho {
            background: #168447;
            color: white;
            padding: 26px 30px;
            text-align: center;
        }

        .cabecalho .simbolo {
            font-size: 34px;
            margin-bottom: 6px;
        }

        .cabecalho h1 {
            margin: 0;
            font-size: 26px;
        }

        .cabecalho p {
            margin: 7px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        form {
            padding: 28px 30px 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label.titulo {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #17683a;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbded1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #168447;
            box-shadow: 0 0 0 3px rgba(22, 132, 71, 0.12);
        }

        .opcoes {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .opcao {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #f5faf7;
            cursor: pointer;
            transition: 0.2s;
        }

        .opcao:hover {
            background: #e8f6ed;
        }

        input[type="radio"],
        input[type="checkbox"] {
            accent-color: #168447;
            width: 17px;
            height: 17px;
        }

        .fidelidade {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #fff5f5;
            border: 1px solid #f0d5d5;
            border-radius: 9px;
            color: #a83232;
            font-weight: bold;
            cursor: pointer;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        input[type="submit"],
        input[type="reset"] {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        input[type="submit"] {
            background: #168447;
            color: white;
        }

        input[type="submit"]:hover {
            background: #116b39;
            transform: translateY(-1px);
        }

        input[type="reset"] {
            background: #f4e7e7;
            color: #a83232;
        }

        input[type="reset"]:hover {
            background: #edd6d6;
        }

        .rodape {
            text-align: center;
            font-size: 12px;
            color: #789080;
            padding: 0 30px 22px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="cabecalho">
            <div class="simbolo">✚</div>
            <h1>Farmácia Paracetaloka</h1>
            <p>Consulta de descontos do cliente</p>
        </header>

        <form action="Paracetaloka.php" method="post">
            <div class="campo">
                <label class="titulo" for="nome">Nome do Cliente</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome do cliente" required>
            </div>

            <div class="campo">
                <label class="titulo" for="total">Total do Pedido</label>
                <input type="number" id="total" name="total" step="0.01" min="0" placeholder="R$ 0,00" required>
            </div>

            <div class="campo">
                <label class="titulo">Faixa Etária</label>

                <div class="opcoes">
                    <label class="opcao">
                        <input type="radio" name="idade" value="0" required>
                        Abaixo de 50 anos
                    </label>

                    <label class="opcao">
                        <input type="radio" name="idade" value="1" required>
                        Entre 51 e 70 anos
                    </label>

                    <label class="opcao">
                        <input type="radio" name="idade" value="2" required>
                        Acima de 70 anos
                    </label>
                </div>
            </div>

            <div class="campo">
                <label class="fidelidade">
                    <input type="checkbox" name="cardF">
                    Cliente possui Cartão Fidelidade
                </label>
            </div>

            <div class="botoes">
                <input type="submit" value="Calcular">
                <input type="reset" value="Limpar">
            </div>
        </form>

        <div class="rodape">
            Atendimento Paracetaloka • Saúde e cuidado
        </div>
    </div>
</body>
</html>
